apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: authentik
  annotations:
    crossplane.io/external-name: authentik
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  deletionPolicy: Orphan
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    name: authentik
  forProvider:
    source: Remote
    module: git::https://github.com/ThriftyStack/controlplane.git?ref=main
    entrypoint: authentik
    remotePullPolicy: Always
    env:
      - name: GOOGLE_APPLICATION_CREDENTIALS
        value: gcp-credentials.json
      # Cluster DNS resolves auth.devoops.uk to the LAN node IP (no :443). Use the
      # in-cluster Service and skip its self-signed TLS for the provider API client.
      - name: AUTHENTIK_URL
        value: https://authentik-server.authentik.svc
      - name: AUTHENTIK_INSECURE
        value: "true"
    vars:
      - key: vault_addr
        value: https://vault.vault.svc:8200
      - key: authentik_url
        value: https://authentik-server.authentik.svc
    # Egor fills the live Authentik IDs, then uncomments varmap.adoption_ids.
    # Leave this commented. adoption_ids stays required and has no default.
    # The empty strings below do not pass validation; they are not stand-ins.
    # varmap:
    #   adoption_ids:
    #     proxmox_admins_entitlement: ""
    #     longhorn_provider: ""
    #     oke_outpost: ""
  writeConnectionSecretToRef:
    name: authentik-workspace
    namespace: crossplane-system
