apiVersion: opentofu.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: authentik
spec:
  credentials:
    - filename: .git-credentials
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: authentik-git-credentials
        key: .git-credentials
    - filename: gcp-credentials.json
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: authentik-gcp-credentials
        key: credentials
